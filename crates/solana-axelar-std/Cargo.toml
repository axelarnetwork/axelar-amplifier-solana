[package]
name = "solana-axelar-std"
version = "1.1.1"
edition = "2021"
description = "Primitive types, encoding and hashing utilities for Axelar Solana integration"
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[package.metadata.cargo-machete]
# `ruint` is intentionally unused directly. It constrains Alloy's transitive
# dependency during `cargo publish`, where the workspace lockfile is ignored.
ignored = ["ruint"]

[dependencies]
alloy-primitives.workspace = true
arrayref.workspace = true
hex.workspace = true
rs_merkle.workspace = true
udigest.workspace = true
thiserror.workspace = true
borsh = { workspace = true, features = ["derive"] }
anchor-lang = { workspace = true, optional = true }
solana-keccak-hasher.workspace = true
bytemuck.workspace = true
bnum.workspace = true
# Keep Alloy's transitive `ruint` on the workspace-pinned SBF-compatible version.
ruint.workspace = true

[dev-dependencies]
rand.workspace = true

[features]
default = []
idl-build = ["dep:anchor-lang", "anchor-lang/idl-build"]
